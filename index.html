  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="theme.css?v=2026-10-28c">
</head>
<body>
  <div id="app">Loading...</div>
  <script>
    window.$docsify = {
      // The logo in the menu: a red tile with a honeycomb cell (BIOBUZZ), then the hub's name
      name: '<span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z"/><path d="M12 8l3.5 2v4L12 16l-3.5-2v-4z"/></svg></span><span class="brand-text"><small>Saucon Valley Robotics</small>Learning Hub</span>',
      search: { placeholder: 'Search the hub', noData: 'No results', depth: 3 },
      loadSidebar: true,
      // No section lists under pages in the menu: the page names alone are easier to scan
      subMaxLevel: 0,
      auto2top: true,
      // Always fetch the latest version of each page, so edits show up on refresh
      requestHeaders: { 'cache-control': 'max-age=0' },
      pagination: { previousText: 'Previous', nextText: 'Next', crossChapter: true },
      // Latest Updates: the newest entry (the first ## heading) gets a red star, so nobody
      // has to move the star by hand when a new update goes on top.
      plugins: [function(hook){
        hook.doneEach(function(){
          var h1 = document.querySelector('#main h1');
          if (!h1 || h1.textContent.trim() !== 'Latest Updates') return;
          var first = document.querySelector('#main h2');
          if (first) first.classList.add('hub-newest');
        });
      }]
    };
  </script>
